<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Products</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/css/bootstrap.min.css">
          
           <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<h1>Choose a Payment Method</h1>
<form th:action="@{/payment/{orderId}(orderId=${orderId})}" method="post">
<div class="form-check">
  <input class="form-check-input" type="radio" name="paymentmethod" th:value="${'UPI-123'}" id="flexRadioDefault1">
  <label class="form-check-label" for="flexRadioDefault1">
    Pay via UPI 
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="paymentmethod" th:value="${'CARD-123'}" id="flexRadioDefault2">
  <label class="form-check-label" for="flexRadioDefault2">
   Pay with card
  </label>
</div>

<div class="form-check">
  <input class="form-check-input" type="radio" name="paymentmethod" th:value="${'CASH-123'}" id="flexRadioDefault2">
  <label class="form-check-label" for="flexRadioDefault2">
   Cash on delivery
  </label>
</div>
<button type="submit" class="btn btn-primary mt-3 w-100">
      Confirm Order
    </button>
</form>
<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
