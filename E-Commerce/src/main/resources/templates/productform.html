<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Insert title here</title>
<link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css">
</head>
<body>

	<div class="container mt-5">
		
			<div class="row">
				<div class="col-md-6 offset-md-3">
					<div class="card">
						<div class="card-body">
							<div class="text-center fs-3">
								<p>Add Product</p></div>
								<div th:text="${msg}"></div>
								<form th:action="@{/addproduct}" th:object="${product}" method="post">
									<div class="mb-3">
										<label for="exampleInputEmail1" class="form-label">Product Name
											</label> <input type="text" class="form-control"
											id="exampleInputEmail1" th:field="*{productName}">

									</div>
									<div class="mb-3">
										<label for="exampleInputEmail1" class="form-label"> Category
											</label> <input type="text" class="form-control"
											id="exampleInputEmail1" th:field="*{category}">
										
									</div>


									<div class="mb-3">
										<label for="exampleInputPassword1" class="form-label">Description</label>
										<input type="text" class="form-control"
											id="exampleInputPassword1" th:field="*{description}">
									</div>
									<div class="mb-3">
										<label for="exampleInputPassword1" class="form-label">Price</label>
										<input type="text" class="form-control"
											id="exampleInputPassword1" th:field="*{price}">
									</div>
									
									
									<button type="submit" class="btn btn-primary">Submit</button>
								</form>
							</div>

						</div>
					</div>
				</div>
			</div>
		




		<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
