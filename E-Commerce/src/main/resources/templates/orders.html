<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Insert title here</title>

<link rel="stylesheet"
          href="/webjars/bootstrap/css/bootstrap.min.css">
          
           <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<table class="table">
  <thead>
    <tr>
      <th scope="col">Order Id</th>
      <th scope="col">Product Id</th>
      <th scope="col">Quantity</th>
      <th scope="col">Price</th>
      <th scope="col">Sub total</th>
      
    </tr>
  </thead>
  <tbody th:each="orderItem:${orderItems}">
    <tr>
      
      <td th:text="${orderItem.orderId}">Mark</td>
      <td th:text="${orderItem.productId}">Otto</td>
      
      <td th:text="${orderItem.quantity}">@mdo</td>
       <td th:text="${orderItem.price}">@mdo</td>
        <td th:text="${orderItem.cost}">@mdo</td>
    </tr>
   
  </tbody>
</table>

<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
