<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Products</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/css/bootstrap.min.css">
          
           <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container-fluid mt-4">
  <div class="text-center text-primary fs-4 fw-bold mb-3">Address</div>
<form th:action="@{/checkout/orderId}" method="post" >
  <div class="card mt-3" th:each="address, iter : ${address}">
    <div class="card-body">
      <div class="form-check">
        <input 
          class="form-check-input" 
          type="checkbox" 
          name="selectedAddress"
          th:value="${address.addressId}" 
          th:id="${'addressCheck-' + iter.index}" required>
        
        <label class="form-check-label" th:for="${'addressCheck-' + iter.index}">
          <h6 class="fw-bold mb-1">
            <span th:text="${address.name}">John Doe</span> 
            <span th:text="${address.mobileNumber}">+1234567890</span>
            <span th:text="${orderId}"></span>
          </h6>
          <p class="mb-0 text-muted">
            <span th:text="${address.area}">Area</span>,
            <span th:text="${address.street}">Street</span>,
            <span th:if="${address.landmark}" th:text="${address.landmark + ', '}">Landmark, </span>
            <span th:text="${address.district}">District</span>,
            <span th:text="${address.state}">State</span>
          </p>
        </label>
      </div>
    </div>
  </div>
  
  <button type="submit" class="btn btn-primary mt-3 w-100">
      Deliver to this Address
    </button>
  </form>
</div>

<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
