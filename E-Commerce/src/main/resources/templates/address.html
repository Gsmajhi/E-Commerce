<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Products</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/css/bootstrap.min.css">
          
           <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container fuid mt-4">
<div class="text-center text-primary">Address</div>
<div class="card mt-5"  th:each="address:${address}">
<div class="card-body">
<h6><span th:text="${address.name}"></span><span> </span><span th:text="${address.mobileNumber}"></span>
</h6>
<h6>
<span th:text="${address.area}"></span>,
<span th:text="${address.street}"></span>,
<span th:text="${address.landmark}"></span>,
<span th:text="${address.district}"></span>,

<span th:text="${address.state}"></span>

</h6>
</div>


</div>

</div>

<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
