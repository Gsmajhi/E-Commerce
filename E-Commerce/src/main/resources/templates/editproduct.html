<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/css/bootstrap.min.css">
          
           <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
<div th:replace="~{fragments/header :: navbar}"></div>
<div class="container mt-5">
		
			<div class="row">
				<div class="col-md-6 offset-md-3">
					<div class="card">
						<div class="card-body">
							<div class="text-center fs-3">
								<p>Edit Product</p></div>
								<div th:text="${msg}"></div>
								<form th:action="@{/updateproduct/{id}(id=${product.productId})}" th:object="${product}" method="post" enctype="multipart/form-data">
									<div class="mb-3">
										<label for="exampleInputEmail1" class="form-label">Product Name
											</label> <input type="text" class="form-control"
											id="exampleInputEmail1" name="productName" th:field="*{productName}">

									</div>
									<div class="mb-3">
										<label for="exampleInputEmail1" class="form-label"> Category
											</label> <input type="text" class="form-control"
											id="exampleInputEmail1" name="category" th:field="*{category}">
										
									</div>


									<div class="mb-3">
										<label for="exampleInputPassword1" class="form-label">Description</label>
										<input type="text" class="form-control"
											id="exampleInputPassword1" name="description" th:field="*{description}">
									</div>
									<div class="mb-3">
										<label for="exampleInputPassword1" class="form-label">Price</label>
										<input type="text" class="form-control"
											id="exampleInputPassword1" name="price" th:field="*{price}">
									</div>
									<div class="mb-3">
										<label for="exampleInputPassword1" class="form-label">Upload Image</label>
										<input type="file" class="form-control" name="image"
											id="exampleInputPassword1" accept="image/png, image/jpeg, image/webp, image/gif" >
									</div>
									
									<button type="submit" class="btn btn-primary">Submit</button>
								</form>
							</div>

						</div>
					</div>
				</div>
			</div>
		




		<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>


</html>
